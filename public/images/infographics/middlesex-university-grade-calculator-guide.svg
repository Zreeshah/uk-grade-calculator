<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Middlesex University grade calculation guide</title>
  <desc id="desc">A neutral diagram showing confirmed module marks and credits becoming a provisional degree result, with a reminder to check Middlesex University programme regulations.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#0369a1"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="88" font-size="35" font-weight="700" fill="#0f172a">Middlesex University grade calculator guide</text>
    <text x="72" y="130" font-size="21" fill="#475569">Use confirmed marks and actual credit values for a provisional degree estimate.</text>
    <rect x="72" y="206" width="280" height="266" rx="24" fill="#fff" stroke="#bae6fd" stroke-width="2"/>
    <text x="108" y="268" font-size="23" font-weight="700" fill="#0f172a">1 · Add your modules</text>
    <text x="108" y="316" font-size="20" fill="#475569">Module mark</text><text x="108" y="349" font-size="31" font-weight="700" fill="#0e7490">72%</text>
    <text x="108" y="403" font-size="20" fill="#475569">Credit value</text><text x="108" y="436" font-size="31" font-weight="700" fill="#0e7490">20 credits</text>
    <rect x="460" y="206" width="280" height="266" rx="24" fill="#fff" stroke="#bae6fd" stroke-width="2"/>
    <text x="496" y="268" font-size="23" font-weight="700" fill="#0f172a">2 · Weight credits</text>
    <text x="496" y="326" font-size="19" fill="#475569">Module mark × credits</text><text x="496" y="358" font-size="19" fill="#475569">÷ total credits</text>
    <rect x="496" y="390" width="208" height="46" rx="10" fill="#e0f2fe"/><text x="521" y="420" font-size="18" font-weight="700" fill="#075985">WEIGHTED AVERAGE</text>
    <rect x="848" y="206" width="280" height="266" rx="24" fill="#fff" stroke="#bae6fd" stroke-width="2"/>
    <text x="884" y="268" font-size="23" font-weight="700" fill="#0f172a">3 · Check your result</text>
    <text x="884" y="325" font-size="19" fill="#475569">Compare the estimate with</text><text x="884" y="354" font-size="19" fill="#475569">your programme regulations.</text>
    <rect x="884" y="392" width="206" height="44" rx="10" fill="url(#accent)"/><text x="906" y="421" font-size="18" font-weight="700" fill="#fff">PROVISIONAL RESULT</text>
    <path d="M410 340h-38m38 0-18-18m18 18-18 18M798 340h-38m38 0-18-18m18 18-18 18" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="550" width="1056" height="58" rx="12" fill="#fff" stroke="#bae6fd" stroke-width="2"/>
    <text x="98" y="586" font-size="19" fill="#0f172a">Your official classification is determined by Middlesex University under the regulations for your programme.</text>
  </g>
</svg>
