<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How a UK university grade calculator works</title>
  <desc id="desc">A three-step diagram showing module marks and credits becoming a credit-weighted average and then a provisional UK degree classification.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="primary" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312e81" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <text x="72" y="86" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">How your university grade is calculated</text>
  <text x="72" y="128" font-family="Arial, sans-serif" font-size="21" fill="#475569">Enter confirmed marks and credits to see a provisional degree-classification estimate.</text>
  <g filter="url(#shadow)">
    <rect x="72" y="188" width="300" height="336" rx="24" fill="#fff"/>
    <rect x="414" y="188" width="300" height="336" rx="24" fill="#fff"/>
    <rect x="756" y="188" width="372" height="336" rx="24" fill="#fff"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="112" cy="230" r="22" fill="#e0e7ff"/><text x="105" y="238" font-size="23" font-weight="700" fill="#4338ca">1</text>
    <text x="152" y="237" font-size="24" font-weight="700" fill="#0f172a">Add modules</text>
    <text x="112" y="282" font-size="19" fill="#475569">Grade</text><text x="285" y="282" font-size="19" fill="#475569">Credits</text>
    <rect x="108" y="300" width="226" height="48" rx="10" fill="#f8fafc"/><text x="128" y="331" font-size="19" fill="#334155">72%</text><text x="287" y="331" font-size="19" fill="#334155">20</text>
    <rect x="108" y="362" width="226" height="48" rx="10" fill="#f8fafc"/><text x="128" y="393" font-size="19" fill="#334155">68%</text><text x="287" y="393" font-size="19" fill="#334155">40</text>
    <rect x="108" y="424" width="226" height="48" rx="10" fill="#f8fafc"/><text x="128" y="455" font-size="19" fill="#334155">65%</text><text x="287" y="455" font-size="19" fill="#334155">20</text>
    <circle cx="454" cy="230" r="22" fill="#e0e7ff"/><text x="447" y="238" font-size="23" font-weight="700" fill="#4338ca">2</text>
    <text x="494" y="237" font-size="24" font-weight="700" fill="#0f172a">Weight credits</text>
    <text x="454" y="291" font-size="19" fill="#475569">Multiply each grade by</text><text x="454" y="320" font-size="19" fill="#475569">its credit value, then divide</text><text x="454" y="349" font-size="19" fill="#475569">by total credits.</text>
    <rect x="454" y="390" width="220" height="66" rx="14" fill="#eef2ff"/><text x="480" y="418" font-size="17" font-weight="700" fill="#4338ca">CREDIT-WEIGHTED</text><text x="480" y="444" font-size="17" font-weight="700" fill="#4338ca">AVERAGE</text>
    <circle cx="796" cy="230" r="22" fill="#e0e7ff"/><text x="789" y="238" font-size="23" font-weight="700" fill="#4338ca">3</text>
    <text x="836" y="237" font-size="24" font-weight="700" fill="#0f172a">Check your band</text>
    <rect x="796" y="280" width="290" height="46" rx="10" fill="#d1fae5"/><text x="818" y="310" font-size="18" font-weight="700" fill="#047857">First · 70% and above</text>
    <rect x="796" y="337" width="290" height="46" rx="10" fill="#dbeafe"/><text x="818" y="367" font-size="18" font-weight="700" fill="#1d4ed8">2:1 · 60%–69%</text>
    <rect x="796" y="394" width="290" height="46" rx="10" fill="#fef3c7"/><text x="818" y="424" font-size="18" font-weight="700" fill="#b45309">2:2 · 50%–59%</text>
    <rect x="796" y="451" width="290" height="46" rx="10" fill="#fee2e2"/><text x="818" y="481" font-size="18" font-weight="700" fill="#b91c1c">Third · 40%–49%</text>
  </g>
  <path d="M380 355h-38m38 0-18-18m18 18-18 18M722 355h-38m38 0-18-18m18 18-18 18" stroke="url(#primary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="605" font-family="Arial, sans-serif" font-size="18" fill="#475569">Your course regulations and exam board decide the official result.</text>
</svg>
