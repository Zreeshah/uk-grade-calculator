<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">MMU Year 2 and Year 3 weighting guide</title>
  <desc id="desc">A visual guide showing the assumed 30 percent Year 2 and 70 percent Year 3 weighting used by this MMU calculator, with a reminder to check programme regulations.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="yearTwo" x1="0" x2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="yearThree" x1="0" x2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="92" font-size="36" font-weight="700" fill="#0f172a">MMU degree-classification weighting</text>
    <text x="72" y="134" font-size="21" fill="#475569">This calculator uses the stated 30/70 Year 2 / Year 3 estimate.</text>
    <rect x="72" y="214" width="316" height="216" rx="24" fill="url(#yearTwo)"/>
    <text x="112" y="280" font-size="24" font-weight="700" fill="#e0e7ff">YEAR 2 · LEVEL 5</text>
    <text x="112" y="365" font-size="88" font-weight="700" fill="#fff">30%</text>
    <rect x="414" y="214" width="714" height="216" rx="24" fill="url(#yearThree)"/>
    <text x="454" y="280" font-size="24" font-weight="700" fill="#c7d2fe">YEAR 3 · LEVEL 6</text>
    <text x="454" y="365" font-size="88" font-weight="700" fill="#fff">70%</text>
    <text x="72" y="510" font-size="25" font-weight="700" fill="#0f172a">Why it matters</text>
    <text x="72" y="550" font-size="21" fill="#475569">Your final-year modules have the greater effect on the overall average in this estimate.</text>
    <rect x="72" y="582" width="1056" height="52" rx="12" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="96" y="615" font-size="19" fill="#3730a3">Confirm your programme handbook and academic regulations: module treatment and classification rules can vary.</text>
  </g>
</svg>
